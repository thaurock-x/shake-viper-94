<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Viper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f13;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .info {
      display: flex;
      gap: 40px;
      margin-bottom: 15px;
      font-size: 1.3rem;
      font-weight: 600;
    }

    #score {
      color: #00ff88;
    }

    #highscore {
      color: #ffaa00;
    }

    #gameCanvas {
      background: #1a1a24;
      border: 4px solid #00ff88;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.25);
      max-width: 95vw;
    }

    .controls {
      margin-top: 18px;
      text-align: center;
      font-size: 0.95rem;
      color: #aaa;
      line-height: 1.5;
    }

    .controls kbd {
      background: #333;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #555;
      font-family: monospace;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #overlay h2 {
      font-size: 3rem;
      color: #ff4444;
      margin-bottom: 10px;
    }

    #overlay p {
      font-size: 1.3rem;
      margin-bottom: 25px;
    }

    #restartBtn {
      background: linear-gradient(90deg, #00ff88, #00ccff);
      border: none;
      color: #111;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 12px 32px;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    #restartBtn:hover {
      transform: scale(1.08);
    }

    .mobile-controls {
      display: none;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 60px);
      gap: 8px;
      margin-top: 20px;
      justify-content: center;
    }

    .mobile-controls button {
      width: 60px;
      height: 60px;
      font-size: 1.8rem;
      background: #222;
      border: 2px solid #00ff88;
      color: #00ff88;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .mobile-controls button:active {
      background: #00ff88;
      color: #111;
      transform: scale(0.95);
    }

    #btnUp    { grid-column: 2; grid-row: 1; }
    #btnLeft  { grid-column: 1; grid-row: 2; }
    #btnDown  { grid-column: 2; grid-row: 2; }
    #btnRight { grid-column: 3; grid-row: 2; }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }

      .info {
        gap: 25px;
        font-size: 1.1rem;
      }

      .controls {
        display: none;
      }

      .mobile-controls {
        display: grid;
      }

      #gameCanvas {
        width: 95vw !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>
  <h1>SNAKE VIPER</h1>

  <div class="info">
    <div>Puntos: <span id="score">0</span></div>
    <div>Récord: <span id="highscore">0</span></div>
  </div>

  <canvas id="gameCanvas" width="480" height="480"></canvas>

  <div class="controls">
    Controles: <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> o <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd><br>
    Pausar: <kbd>Espacio</kbd> &nbsp;|&nbsp; Reiniciar: <kbd>R</kbd>
  </div>

  <div class="mobile-controls">
    <button id="btnUp">↑</button>
    <button id="btnLeft">←</button>
    <button id="btnDown">↓</button>
    <button id="btnRight">→</button>
  </div>

  <div id="overlay">
    <h2>¡GAME OVER!</h2>
    <p>Puntuación final: <span id="finalScore">0</span></p>
    <button id="restartBtn">Jugar de nuevo</button>
  </div>

  <script>
    // ==================== SNAKE VIPER ====================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = {};
    let score = 0;
    let highScore = localStorage.getItem('snakeViperHigh') || 0;
    let gameLoop = null;
    let isPaused = false;
    let isGameOver = false;
    let speed = 120;

    // Elementos DOM
    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');

    highscoreEl.textContent = highScore;

    // ==================== SONIDOS (Web Audio API) ====================
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'square', volume = 0.15) {
      if (!audioCtx) return;
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + duration);
    }

    function playEat() {
      // Sonido de comer (agudo y corto)
      playTone(880, 0.08, 'square', 0.12);
      setTimeout(() => playTone(1320, 0.1, 'square', 0.1), 60);
    }

    function playGameOver() {
      // Sonido de muerte (descendente)
      playTone(440, 0.15, 'sawtooth', 0.2);
      setTimeout(() => playTone(330, 0.2, 'sawtooth', 0.18), 120);
      setTimeout(() => playTone(220, 0.3, 'sawtooth', 0.15), 280);
    }

    function playMove() {
      // Sonido sutil de movimiento (opcional, muy bajo)
      // playTone(150, 0.03, 'triangle', 0.04);
    }

    function playPause() {
      playTone(600, 0.08, 'sine', 0.1);
    }

    // ==================== INICIALIZACIÓN ====================
    function init() {
      initAudio(); // Activa el audio al iniciar

      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      speed = 120;
      isPaused = false;
      isGameOver = false;
      scoreEl.textContent = '0';
      overlay.style.display = 'none';
      spawnFood();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, speed);
    }

    // ==================== COMIDA ====================
    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
        valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
      }
    }

    // ==================== ACTUALIZACIÓN ====================
    function update() {
      if (isPaused || isGameOver) return;

      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // Colisión con paredes
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver();
        return;
      }

      // Colisión con el propio cuerpo
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Comer comida
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        playEat(); // ← Sonido de comer

        if (score > highScore) {
          highScore = score;
          highscoreEl.textContent = highScore;
          localStorage.setItem('snakeViperHigh', highScore);
        }
        if (speed > 50) {
          speed -= 3;
          clearInterval(gameLoop);
          gameLoop = setInterval(update, speed);
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    // ==================== DIBUJADO ====================
    function draw() {
      ctx.fillStyle = '#1a1a24';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Cuadrícula sutil
      ctx.strokeStyle = '#252530';
      ctx.lineWidth = 1;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * GRID);
        ctx.lineTo(canvas.width, i * GRID);
        ctx.stroke();
      }

      // Comida
      ctx.fillStyle = '#ff3355';
      ctx.shadowColor = '#ff3355';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(
        food.x * GRID + GRID / 2,
        food.y * GRID + GRID / 2,
        GRID / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;

      // Serpiente
      snake.forEach((seg, index) => {
        if (index === 0) {
          ctx.fillStyle = '#00ff88';
          ctx.shadowColor = '#00ff88';
          ctx.shadowBlur = 12;
        } else {
          const alpha = 1 - (index / snake.length) * 0.6;
          ctx.fillStyle = `rgba(0, 220, 140, ${alpha})`;
          ctx.shadowBlur = 0;
        }

        ctx.fillRect(
          seg.x * GRID + 1,
          seg.y * GRID + 1,
          GRID - 2,
          GRID - 2
        );
      });
      ctx.shadowBlur = 0;
    }

    // ==================== GAME OVER ====================
    function gameOver() {
      isGameOver = true;
      clearInterval(gameLoop);
      finalScoreEl.textContent = score;
      overlay.style.display = 'flex';
      playGameOver(); // ← Sonido de game over
    }

    // ==================== CONTROLES ====================
    document.addEventListener('keydown', e => {
      initAudio(); // Asegura que el audio se active con la primera tecla

      if (isGameOver && e.key.toLowerCase() === 'r') {
        init();
        return;
      }

      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        isPaused = !isPaused;
        playPause();
        return;
      }

      const key = e.key.toLowerCase();

      if ((key === 'arrowup' || key === 'w') && direction.y === 0) {
        nextDirection = { x: 0, y: -1 };
      } else if ((key === 'arrowdown' || key === 's') && direction.y === 0) {
        nextDirection = { x: 0, y: 1 };
      } else if ((key === 'arrowleft' || key === 'a') && direction.x === 0) {
        nextDirection = { x: -1, y: 0 };
      } else if ((key === 'arrowright' || key === 'd') && direction.x === 0) {
        nextDirection = { x: 1, y: 0 };
      }
    });

    // Botones táctiles
    function setDirection(x, y) {
      initAudio();
      if (x !== 0 && direction.x === 0) nextDirection = { x, y: 0 };
      if (y !== 0 && direction.y === 0) nextDirection = { x: 0, y };
    }

    document.getElementById('btnUp').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('btnDown').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('btnLeft').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('btnRight').addEventListener('click', () => setDirection(1, 0));

    // Soporte táctil mejorado
    ['btnUp', 'btnDown', 'btnLeft', 'btnRight'].forEach(id => {
      const btn = document.getElementById(id);
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        btn.click();
      }, { passive: false });
    });

    // Botón reiniciar
    restartBtn.addEventListener('click', () => {
      initAudio();
      init();
    });

    // ==================== INICIAR ====================
    // El juego empieza al tocar cualquier botón o tecla (para activar audio en móviles)
    init();
  </script>
</body>
</html>
